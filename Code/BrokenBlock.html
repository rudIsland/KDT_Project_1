<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="shortcut icon" href="#"> <!--favicon error 제거용-->
    <link rel="stylesheet" href="CSS/game.css">
    <title>Broken Block</title>
</head>
<body>
    <h2 class="h2 mt-3">Broken Block</h2>
    <!--웹폰트로 수정하기(예정)-->
    <div class="intro" style="display: block;">
        <div class="canvas">
            <div id="introinfo">
                <p>STAGE <span class="stage">1</span></p>
                <button id="btnPlay" class="btn btn-primary">PLAY</button>
            </div>
        </div>
    </div><!--인트로 : play 클릭 시 게임 화면으로-->
    <div class="play" style="display: none;">
        <div class="canvas">
            <div id="info">
                <div>STAGE <span id="stage">1</span></div>
                <div>Score : <span id="score"><!--점수--></span></div>
                <div>Life : <span id="life"><!--생명--></span>
                / <span id="max_life"><!--생명최대치--></span></div>
            </div>
            <canvas class="wall" id="wall"></canvas>
            <br>
        </div>
        <button class="btn btn-outline-primary">Pause</button>
        <button class="btn btn-outline-primary">Replay</button><!--버튼 : 부트스트랩 디자인-->
    </div><!--플레이화면 : replay 클릭 시 인트로 화면으로-->
    <script>
        //인트로 -> 플레이화면 전환
        //(현재)플레이화면은 단순히 숨겨져 있는 상태, (게임시작버튼을 누르기 전에 안보이는곳에서 자동으로 게임이 실행되고 있음), 시작버튼을 눌렀을때부터 플레이화면의 게임실행 로직 JS가 실행되도록 수정 필요
        const playBtn = document.querySelector('#btnPlay');
        const introDiv = document.querySelector('.intro');
        const playDiv = document.querySelector('.play');
        playBtn.addEventListener("click",playClick);
        // onclick="playClick()"
        function playClick() {
            if (introDiv.style.display === 'block' && playDiv.style.display === 'none') {
                introDiv.style.display = 'none';
                playDiv.style.display = 'block';
            } else {
                introDiv.style.display = 'block';
                playDiv.style.display = 'none';
            }
        }
        //게임오버화면
        //일시정지

        //다시시작

    </script>
    <script type="module" src="./JS/logic.js"></script>
</body>
</html>
